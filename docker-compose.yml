version: '3.8'

services:
  # -----------------------------------------------------
  # 1. PostgreSQL (Database chung cho các Microservices)
  # -----------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: seo_auto_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: AdminPassword123!
      POSTGRES_DB: seo_auto_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - seo_network

  # -----------------------------------------------------
  # 2. Redis (Cache, Cấu hình Rate Limiting, SignalR Backplane)
  # -----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: seo_auto_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - seo_network

  # -----------------------------------------------------
  # 3. RabbitMQ (Message Broker cho giao tiếp bất đồng bộ)
  # -----------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: seo_auto_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      # Port cho ứng dụng giao tiếp (AMQP)
      - "5672:5672"
      # Port cho giao diện quản trị Web UI (http://localhost:15672)
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - seo_network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  seo_network:
    driver: bridge
